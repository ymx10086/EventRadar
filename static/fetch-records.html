<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抓取记录 - EventRadar</title>
    <style>
        :root {
            --primary-color: #1890ff;
            --success-color: #52c41a;
            --warning-color: #fa8c16;
            --error-color: #ff4d4f;
            --text-primary: #262626;
            --text-secondary: #595959;
            --text-muted: #8c8c8c;
            --bg-primary: #ffffff;
            --bg-secondary: #fafafa;
            --border-light: #f0f0f0;
            --border-base: #d9d9d9;
            --shadow-light: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-base: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius-base: 8px;
            --radius-large: 12px;
            --font-xs: 12px;
            --font-sm: 14px;
            --font-base: 16px;
            --font-lg: 20px;
            --font-xl: 24px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            --duration-fast: 200ms;
            --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
        }

        .layout {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-lg);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }

        .header-left h1 {
            color: var(--text-primary);
            font-size: var(--font-xl);
            font-weight: 700;
        }

        .header-left p {
            margin-top: 4px;
            color: var(--text-secondary);
            font-size: var(--font-sm);
        }

        .header-actions,
        .toolbar-actions {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            min-width: 0;
        }

        .btn-sm,
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-base);
            border-radius: var(--radius-base);
            background: var(--bg-primary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: var(--font-xs);
            font-weight: 600;
            text-decoration: none;
            white-space: nowrap;
            transition: all var(--duration-fast) var(--ease-in-out);
        }

        .btn-sm {
            min-height: 30px;
            padding: 6px 16px;
        }

        .btn {
            min-height: 38px;
            padding: 9px 20px;
            font-size: var(--font-sm);
        }

        .btn-sm:hover,
        .btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .btn-primary {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: #fff;
        }

        .btn-primary:hover {
            border-color: #096dd9;
            background: #096dd9;
            color: #fff;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }

        .summary-card,
        .panel {
            border: 1px solid var(--border-light);
            border-radius: var(--radius-large);
            background: var(--bg-primary);
            box-shadow: var(--shadow-light);
        }

        .summary-card {
            padding: var(--space-md);
        }

        .summary-card span {
            color: var(--text-muted);
            font-size: var(--font-xs);
        }

        .summary-card strong {
            display: block;
            margin-top: 2px;
            color: var(--text-primary);
            font-size: var(--font-lg);
            line-height: 1.2;
        }

        .panel {
            padding: var(--space-lg);
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .toolbar h2 {
            font-size: var(--font-base);
            font-weight: 700;
        }

        .toolbar p {
            color: var(--text-muted);
            font-size: var(--font-xs);
        }

        .records-list {
            display: grid;
            gap: var(--space-md);
        }

        .record-card {
            min-width: 0;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-large);
            background: var(--bg-secondary);
            padding: var(--space-md);
        }

        .record-head {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: var(--space-md);
            align-items: start;
            margin-bottom: var(--space-sm);
        }

        .record-title {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            min-width: 0;
        }

        .record-title strong {
            overflow: hidden;
            color: var(--text-primary);
            font-size: var(--font-sm);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
        }

        .status-badge.success {
            background: rgba(82, 196, 26, 0.12);
            color: #237804;
        }

        .status-badge.failed {
            background: rgba(255, 77, 79, 0.1);
            color: var(--error-color);
        }

        .record-meta,
        .record-source,
        .record-error,
        .muted {
            color: var(--text-secondary);
            font-size: var(--font-xs);
        }

        .record-error {
            margin-top: var(--space-sm);
            color: var(--error-color);
        }

        .record-metrics {
            display: grid;
            grid-template-columns: repeat(4, minmax(58px, 1fr));
            gap: var(--space-sm);
            min-width: 280px;
        }

        .record-metrics span {
            min-width: 0;
            padding: 8px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-base);
            background: var(--bg-primary);
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
        }

        .record-metrics strong {
            display: block;
            color: var(--text-primary);
            font-size: var(--font-lg);
            line-height: 1.1;
        }

        .record-articles {
            margin-top: var(--space-sm);
            border-top: 1px solid var(--border-light);
            padding-top: var(--space-sm);
        }

        .record-articles summary {
            cursor: pointer;
            color: var(--text-secondary);
            font-size: var(--font-xs);
            font-weight: 700;
        }

        .record-article-list {
            display: grid;
            gap: var(--space-sm);
            margin-top: var(--space-sm);
            max-height: 360px;
            overflow: auto;
        }

        .record-article {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: var(--space-sm);
            align-items: center;
            padding: 8px 10px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-base);
            background: var(--bg-primary);
        }

        .record-article strong {
            display: block;
            overflow: hidden;
            color: var(--text-primary);
            font-size: var(--font-xs);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .record-article p {
            color: var(--text-muted);
            font-size: 11px;
        }

        .record-article a {
            overflow: hidden;
            color: var(--primary-color);
            font-size: var(--font-xs);
            text-decoration: none;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty-state {
            padding: var(--space-lg);
            border: 1px dashed var(--border-base);
            border-radius: var(--radius-large);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: var(--font-sm);
            text-align: center;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 6px;
            border: 2px solid var(--border-light);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            vertical-align: middle;
            animation: spin 0.6s linear infinite;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: var(--space-xl);
            padding-top: var(--space-md);
            border-top: 1px solid var(--border-light);
            color: var(--text-muted);
            font-size: var(--font-xs);
        }

        .footer a {
            color: var(--text-muted);
            text-decoration: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .layout { padding: var(--space-lg) var(--space-md); }
            .header,
            .toolbar,
            .footer {
                align-items: flex-start;
                flex-direction: column;
            }
            .summary-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .record-head,
            .record-article {
                grid-template-columns: 1fr;
            }
            .record-metrics {
                min-width: 0;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .summary-grid {
                grid-template-columns: 1fr;
            }
            .header-actions,
            .toolbar-actions {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr;
            }
            .btn-sm,
            .btn {
                min-width: 0;
                width: 100%;
            }
            .record-card,
            .panel {
                padding: var(--space-md);
            }
        }
    </style>
</head>
<body>
    <div class="layout">
        <div class="header">
            <div class="header-left">
                <h1>抓取记录</h1>
                <p>查看自动抓取历史、文章清单、活动抽取和入库结果</p>
            </div>
            <div class="header-actions">
                <a href="/admin.html" class="btn-sm">返回面板</a>
                <a href="/events.html" class="btn-sm">活动日历</a>
                <button class="btn-sm btn-primary" onclick="loadFetchRecords()">刷新记录</button>
            </div>
        </div>

        <div class="summary-grid">
            <div class="summary-card"><span>记录数</span><strong id="summaryRuns">-</strong></div>
            <div class="summary-card"><span>文章</span><strong id="summaryArticles">-</strong></div>
            <div class="summary-card"><span>活动</span><strong id="summaryEvents">-</strong></div>
            <div class="summary-card"><span>入库</span><strong id="summarySaved">-</strong></div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <div>
                    <h2>历史抓取日志</h2>
                    <p id="fetchRecordsStatus">正在读取抓取记录...</p>
                </div>
                <div class="toolbar-actions">
                    <button class="btn-sm" onclick="loadFetchRecords()">抓取记录</button>
                    <button class="btn-sm" onclick="loadAutomationRuns()">运行日志</button>
                </div>
            </div>
            <div class="records-list" id="fetchRecordsList">
                <div class="empty-state"><span class="loading-spinner"></span>正在加载</div>
            </div>
        </div>

        <div class="footer">
            <span>EventRadar v1.0.0</span>
            <a href="/api/docs">API 文档</a>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value || '').replace(/[&<>"']/g, function (c) {
                return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
            });
        }

        function formatDateTime(value) {
            var num = Number(value || 0);
            if (!num) return '-';
            return new Date(num * 1000).toLocaleString('zh-CN', { hour12: false });
        }

        function accountNames(accounts) {
            var names = (accounts || []).map(function (item) {
                return item.nickname || item.alias || item.fakeid || '';
            }).filter(Boolean);
            return names.length ? names.join('、') : '未记录来源';
        }

        function recordDateRange(record) {
            if (record.start_date && record.end_date && record.start_date !== record.end_date) {
                return record.start_date + ' - ' + record.end_date;
            }
            return record.date || record.start_date || '-';
        }

        function setSummary(records) {
            var articleCount = 0;
            var eventCount = 0;
            var savedCount = 0;
            (records || []).forEach(function (record) {
                articleCount += Number(record.article_count || 0);
                eventCount += Number(record.event_count || 0);
                savedCount += Number(record.saved_count || 0);
            });
            document.getElementById('summaryRuns').textContent = records.length;
            document.getElementById('summaryArticles').textContent = articleCount;
            document.getElementById('summaryEvents').textContent = eventCount;
            document.getElementById('summarySaved').textContent = savedCount;
        }

        function renderRecordArticle(article) {
            var time = article.publish_time ? formatDateTime(article.publish_time) : (article.fetched_at ? formatDateTime(article.fetched_at) : '-');
            var source = article.account_name || article.account_alias || article.fakeid || '未知来源';
            var link = article.link
                ? '<a href="' + escapeHtml(article.link) + '" target="_blank" rel="noopener">原文</a>'
                : '<span class="muted">无链接</span>';
            return '<div class="record-article">' +
                '<div><strong title="' + escapeHtml(article.title || '') + '">' + escapeHtml(article.title || '未命名文章') + '</strong>' +
                '<p>' + escapeHtml(source) + ' · ' + escapeHtml(time) + ' · 图片 ' + escapeHtml(article.image_count || 0) + '</p></div>' +
                link +
                '</div>';
        }

        function renderFetchRecord(record) {
            var ok = record.status === 'success';
            var articles = record.articles || [];
            return '<article class="record-card">' +
                '<div class="record-head">' +
                    '<div>' +
                        '<div class="record-title"><span class="status-badge ' + (ok ? 'success' : 'failed') + '">' + escapeHtml(ok ? '成功' : '失败') + '</span><strong>' + escapeHtml(formatDateTime(record.started_at)) + '</strong></div>' +
                        '<div class="record-meta">' + escapeHtml(recordDateRange(record)) + ' · 耗时 ' + escapeHtml(record.duration_seconds || 0) + ' 秒</div>' +
                        '<div class="record-source">来源：' + escapeHtml(accountNames(record.selected_accounts)) + '</div>' +
                    '</div>' +
                    '<div class="record-metrics">' +
                        '<span><strong>' + escapeHtml(record.article_count || 0) + '</strong>文章</span>' +
                        '<span><strong>' + escapeHtml(record.event_count || 0) + '</strong>活动</span>' +
                        '<span><strong>' + escapeHtml(record.saved_count || 0) + '</strong>入库</span>' +
                        '<span><strong>' + escapeHtml(record.downloaded_image_count || 0) + '</strong>图片</span>' +
                    '</div>' +
                '</div>' +
                (record.error ? '<div class="record-error">' + escapeHtml(record.error) + '</div>' : '') +
                '<details class="record-articles" open><summary>本次抓取文章 ' + escapeHtml(articles.length) + (record.articles_truncated ? '+' : '') + ' 篇</summary>' +
                    '<div class="record-article-list">' + (articles.length ? articles.map(renderRecordArticle).join('') : '<div class="empty-state">没有找到文章归档，旧记录可能没有保存文章清单。</div>') + '</div>' +
                '</details>' +
                '</article>';
        }

        async function loadFetchRecords() {
            var status = document.getElementById('fetchRecordsStatus');
            var list = document.getElementById('fetchRecordsList');
            status.textContent = '正在读取抓取记录...';
            list.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span>正在加载</div>';
            try {
                var res = await fetch('/api/automation/fetch-records?limit=50&articles_per_run=120');
                var data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.detail || '读取失败');
                var records = (data.data && data.data.records) || [];
                setSummary(records);
                list.innerHTML = records.length
                    ? records.map(renderFetchRecord).join('')
                    : '<div class="empty-state">暂无抓取记录。运行一次自动抓取后，这里会显示文章清单和抽取结果。</div>';
                status.textContent = records.length ? '最近 ' + records.length + ' 次抓取记录' : '暂无抓取记录';
            } catch (e) {
                setSummary([]);
                status.textContent = '读取失败：' + e.message;
                list.innerHTML = '<div class="empty-state">抓取记录读取失败：' + escapeHtml(e.message) + '</div>';
            }
        }

        async function loadAutomationRuns() {
            var status = document.getElementById('fetchRecordsStatus');
            var list = document.getElementById('fetchRecordsList');
            status.textContent = '正在读取运行日志...';
            list.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span>正在加载</div>';
            try {
                var res = await fetch('/api/automation/runs?limit=50');
                var data = await res.json();
                if (!res.ok || !data.success) throw new Error(data.detail || '读取失败');
                var runs = (data.data && data.data.runs) || [];
                var summaryRecords = runs.map(function (run) {
                    var result = run.result || {};
                    var archive = result.archive || {};
                    var events = result.events || {};
                    return {
                        article_count: archive.article_count || 0,
                        event_count: events.event_count || 0,
                        saved_count: events.saved_count || 0
                    };
                });
                setSummary(summaryRecords);
                list.innerHTML = runs.length
                    ? runs.map(function (run) {
                        var result = run.result || {};
                        var archive = result.archive || {};
                        var events = result.events || {};
                        return '<article class="record-card">' +
                            '<div class="record-head">' +
                                '<div><div class="record-title"><span class="status-badge ' + (run.status === 'success' ? 'success' : 'failed') + '">' + escapeHtml(run.status || '-') + '</span><strong>' + escapeHtml(formatDateTime(run.started_at)) + '</strong></div>' +
                                '<div class="record-meta">来源：' + escapeHtml((run.params && run.params.source) || '-') + ' · 耗时 ' + escapeHtml(run.duration_seconds || 0) + ' 秒</div>' +
                                (run.error ? '<div class="record-error">' + escapeHtml(run.error) + '</div>' : '') + '</div>' +
                                '<div class="record-metrics"><span><strong>' + escapeHtml(archive.article_count || 0) + '</strong>文章</span><span><strong>' + escapeHtml(events.event_count || 0) + '</strong>活动</span><span><strong>' + escapeHtml(events.saved_count || 0) + '</strong>入库</span><span><strong>' + escapeHtml((result.selected_accounts || []).length) + '</strong>来源</span></div>' +
                            '</div>' +
                        '</article>';
                    }).join('')
                    : '<div class="empty-state">暂无运行日志。</div>';
                status.textContent = runs.length ? '最近 ' + runs.length + ' 条运行日志' : '暂无运行日志';
            } catch (e) {
                setSummary([]);
                status.textContent = '读取失败：' + e.message;
                list.innerHTML = '<div class="empty-state">运行日志读取失败：' + escapeHtml(e.message) + '</div>';
            }
        }

        window.addEventListener('load', loadFetchRecords);
    </script>
</body>
</html>
