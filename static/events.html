<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventRadar｜活动日历</title>
    <link rel="stylesheet" href="/static/css/events-app.css?v=20260526-system1">
</head>
<body>
    <div class="app-shell events-workbench">
        <aside class="product-nav" aria-label="EventRadar navigation">
            <div class="nav-brand">
                <img class="brand-logo" src="/imgs/EventRadar.png" alt="EventRadar">
                <div>
                    <strong>EventRadar</strong>
                    <span>AI 活动日历助手</span>
                </div>
            </div>
            <nav class="nav-list">
                <button class="nav-item active" data-page="app" data-section="calendar-month" data-action="show-calendar">日历</button>
                <button class="nav-item" data-page="app" data-section="activity-cards" data-action="show-activity">活动</button>
                <button class="nav-item" data-page="app" data-section="import" data-action="open-import-nav">导入</button>
                <button class="nav-item" data-page="app" data-section="preference" data-action="open-preference-nav">偏好</button>
                <button class="nav-item" data-page="app" data-section="settings" data-action="open-settings-nav">设置</button>
            </nav>
            <div class="nav-actions">
                <a class="btn nav-admin" href="/admin.html">管理后台</a>
                <a class="btn nav-export" href="/api/events/calendar.ics" target="_blank" rel="noopener">导出日历</a>
            </div>
        </aside>

        <main class="product-main" id="homeSection">
            <section class="product-page app-view active" id="page-app">
            <section class="card calendar-workspace main" id="page-calendar">
                <div class="calendar-head">
                    <div>
                        <span class="eyebrow">Calendar</span>
                        <div class="calendar-title" id="rangeTitle">-</div>
                        <p class="mode-description" id="modeDescription">按月份查看活动分布。</p>
                    </div>
                    <div class="row-actions calendar-nav">
                        <div class="segmented compact-view-switch">
                        <button id="viewTop-month" data-action="set-view" data-view="month">月</button>
                        <button id="viewTop-week" data-action="set-view" data-view="week">周</button>
                        <button id="viewTop-list" data-action="set-view" data-view="list">列表</button>
                        <button id="viewTop-cards" data-action="set-view" data-view="cards">卡片</button>
                        </div>
                        <button class="icon-button" aria-label="上一个时间段" data-action="move-range" data-delta="-1">‹</button>
                        <button data-action="jump-today">今天</button>
                        <button class="icon-button" aria-label="下一个时间段" data-action="move-range" data-delta="1">›</button>
                        <input id="monthInput" class="toolbar-month" type="month" aria-label="选择月份" data-action="change-month">
                        <input id="keywordInput" class="toolbar-search" type="search" placeholder="搜索活动、地点、来源" aria-label="搜索活动" data-action="search-keyword">
                        <button data-action="load-events">搜索</button>
                    </div>
                </div>
                <details class="filters-drawer calendar-filters" id="filtersDrawer">
                    <summary class="sidebar-summary">
                        <span>高级筛选</span>
                        <span class="badge">Filters</span>
                    </summary>
                    <div class="filter-bar">
                        <div class="field">
                            <label>等级</label>
                            <select id="levelFilter" data-action="load-events">
                                <option value="">全部等级</option>
                                <option value="S">S 强相关</option>
                                <option value="A">A 值得关注</option>
                                <option value="B">B 一般相关</option>
                                <option value="C">C 低相关</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>标签</label>
                            <select id="tagFilter" data-action="load-events">
                                <option value="">全部标签</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>状态</label>
                            <select id="statusFilter" data-action="load-events">
                                <option value="">全部有效</option>
                                <option value="pending">待确认</option>
                                <option value="confirmed">已确认</option>
                                <option value="ignored">已忽略</option>
                            </select>
                        </div>
                        <div class="field">
                            <label>收藏</label>
                            <select id="favoriteFilter" data-action="load-events">
                                <option value="">全部</option>
                                <option value="favorite">仅收藏</option>
                                <option value="unfavorite">仅未收藏</option>
                            </select>
                        </div>
                        <button class="primary" data-action="load-events">刷新</button>
                        <button data-action="clear-filters">清空</button>
                    </div>
                </details>
                <div class="status-line" id="calendarStatus"></div>
                <div class="calendar-root" id="calendarRoot"></div>
            </section>
            </section>
        </main>

        <aside class="right-rail">
            <section class="card rail-card up-next-card">
                <span class="eyebrow">Up Next</span>
                <h2>接下来</h2>
                <div id="upNextEvents" class="up-next-list"></div>
            </section>
            <section class="card rail-card">
                <span class="eyebrow">Overview</span>
                <h2>今日概览</h2>
                <section class="stats metric-strip rail-stats" id="stats" aria-label="活动概览"></section>
                <div class="row-actions rail-actions">
                    <button class="primary" data-action="open-modal" data-modal="addModal">添加</button>
                    <a class="btn" href="/api/events/calendar.ics" target="_blank" rel="noopener">导出</a>
                </div>
            </section>
            <section class="card rail-card">
                <span class="eyebrow">Import</span>
                <h2>导入活动</h2>
                <div class="rail-button-stack">
                    <button data-action="open-modal" data-modal="extractModal">公众号文章</button>
                    <button data-action="open-modal" data-modal="addModal">链接 / 文本 / 图片</button>
                    <button data-action="open-sources">管理来源</button>
                </div>
            </section>
        </aside>
    </div>

    <script src="/static/js/state/events-state.js?v=20260526-mod1" defer></script>
    <script src="/static/js/api/events-api.js?v=20260526-mod1" defer></script>
    <script src="/static/js/render/event-card.js?v=20260526-mod1" defer></script>
    <script src="/static/js/render/calendar-renderer.js?v=20260526-mod1" defer></script>
    <script src="/static/js/ui/modals.js?v=20260526-mod1" defer></script>
    <script src="/static/js/events-app.js?v=20260526-mod1" defer></script>
</body>
</html>
